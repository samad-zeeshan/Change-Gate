[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "change-gate"
version = "0.1.0"
description = "Multi-tenant config-change / feature-flag approval gate: LangGraph agent + secure MCP server with a deterministic risk engine."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Change-Gate" }]

dependencies = [
    "langgraph==0.3.34",
    "langchain-core==0.3.86",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
eval = ["matplotlib>=3.8.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
markers = [
    "postgres: requires a live Postgres (RLS / isolation / audit suites)",
    "keycloak: requires a live Keycloak (full end-to-end OAuth flow)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
