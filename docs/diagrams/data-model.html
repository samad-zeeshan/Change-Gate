<g class="note"><rect x="1120" y="40" width="280" height="200" rx="8"/>
<text class="n-title" x="1136" y="66">Tenant isolation</text>
<text class="n-text" x="1136" y="92">Every table carries tenant_id and</text>
<text class="n-text" x="1136" y="110">the RLS policy tenant_isolation:</text>
<text class="n-code" x="1136" y="132">tenant_id = current_tenant()</text>
<text class="n-text" x="1136" y="156">The app role is NOBYPASSRLS and</text>
<text class="n-text" x="1136" y="174">sets app.current_tenant in each</text>
<text class="n-text" x="1136" y="192">transaction before any query.</text>
<text class="n-src" x="1136" y="222">db/02_rls.sql</text></g>
<g class="note sec-note"><rect x="1120" y="576" width="280" height="190" rx="8"/>
<text class="n-title" x="1136" y="602">Why the audit log holds up</text>
<text class="n-text" x="1136" y="628">entry_hash = sha256(prev_hash +</text>
<text class="n-text" x="1136" y="646">the row). Editing an old row breaks</text>
<text class="n-text" x="1136" y="664">every later hash.</text>
<text class="n-text" x="1136" y="690">A trigger blocks UPDATE, DELETE.</text>
<text class="n-text" x="1136" y="708">The app role only has INSERT.</text>
<text class="n-src" x="1136" y="740">audit.py, db/02_rls.sql</text></g>

(function(){
  var root=document.documentElement, b=document.getElementById('theme');
  function cur(){ var t=root.getAttribute('data-theme'); if(t) return t; return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
  function label(){ b.textContent = cur()==='dark' ? 'Light' : 'Dark'; }
  try { var s=localStorage.getItem('cg-theme'); if(s) root.setAttribute('data-theme', s); } catch(e) {}
  var q=new URLSearchParams(location.search).get('theme'); if(q) root.setAttribute('data-theme', q);
  label();
  b.addEventListener('click', function(){ var n=cur()==='dark'?'light':'dark'; root.setAttribute('data-theme', n); try{localStorage.setItem('cg-theme', n);}catch(e){} label(); });
})();
</script>
